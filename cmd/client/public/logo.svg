<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A database whose layers are schedules, each a line of times crossed by now: one ringing, another between two times, a disabled one dim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c31"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="106" y1="100" x2="406" y2="420">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="now" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the store, three layers -->
  <path d="M106 144 V376 A150 44 0 0 0 406 376 V144 Z" fill="#0a1020"/>
  <g fill="none" stroke="url(#face)" stroke-linecap="round">
    <path d="M106 221 A150 44 0 0 0 406 221 M106 298 A150 44 0 0 0 406 298" stroke-width="10"/>
    <path d="M106 144 V376 A150 44 0 0 0 406 376 V144" stroke-width="18"/>
    <ellipse cx="256" cy="144" rx="150" ry="44" fill="#0a1020" stroke-width="18"/>
  </g>

  <!-- now -->
  <line x1="256" y1="200" x2="256" y2="404" stroke="url(#now)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- a schedule ringing: times passed lit, those to come dim -->
  <g fill="#7dd3fc">
    <circle cx="151" cy="213.9" r="9"/><circle cx="186" cy="221.4" r="9"/><circle cx="221" cy="225.3" r="9"/>
  </g>
  <g fill="#334155">
    <circle cx="291" cy="225.3" r="6"/><circle cx="326" cy="221.4" r="6"/><circle cx="361" cy="213.9" r="6"/>
  </g>
  <circle cx="256" cy="226.5" r="36" fill="url(#glow)"/>
  <circle cx="256" cy="226.5" r="13" fill="#fde68a"/>

  <!-- another, between two times -->
  <g fill="#7dd3fc">
    <circle cx="160" cy="293.3" r="9"/><circle cx="224" cy="302.5" r="9"/>
  </g>
  <g fill="#334155">
    <circle cx="288" cy="302.5" r="6"/><circle cx="352" cy="293.3" r="6"/>
  </g>

  <!-- a disabled one -->
  <g fill="#334155">
    <circle cx="151" cy="368.4" r="6"/><circle cx="186" cy="375.9" r="6"/><circle cx="221" cy="379.8" r="6"/>
    <circle cx="291" cy="379.8" r="6"/><circle cx="326" cy="375.9" r="6"/><circle cx="361" cy="368.4" r="6"/>
  </g>
</svg>
