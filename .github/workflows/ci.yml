name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Pinned, so that lint results are the same locally and in CI. The Makefile uses ./bin/golangci-lint when present.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b ./bin v2.11.3

      - name: Lint and test
        run: make check

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/client
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/client/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format
        run: npx prettier --check src/

      - name: Type-check and build
        run: npm run build
