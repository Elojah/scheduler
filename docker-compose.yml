services:
  # MQTT broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: scheduler_mosquitto
    hostname: mosquitto
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - scheduler_network
    expose:
      - 1883
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 1s

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
    container_name: scheduler
    hostname: scheduler
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./config/scheduler/docker.json:/app/docker.json:ro
      - data:/data
    networks:
      - scheduler_network

  # Web UI, on localhost:8080
  web_client:
    build:
      context: .
      dockerfile: docker/web_client/Dockerfile
    container_name: scheduler_web_client
    hostname: web_client
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./config/web_client/docker.json:/app/docker.json:ro
    networks:
      - scheduler_network
    ports:
      - "8080:8080"

  # A simulated SunSpec inverter, Modbus TCP on localhost:502, built from sunspec at go.mod's version
  sunspec:
    build:
      context: https://github.com/Elojah/sunspec.git#v1.2.0
      dockerfile: cmd/simulator/Dockerfile
    container_name: scheduler_sunspec
    hostname: sunspec
    # A day every 10 minutes
    command: ["-day", "10m"]
    networks:
      - scheduler_network
    expose:
      - 502
    ports:
      - "502:502"

networks:
  scheduler_network:

volumes:
  data:
