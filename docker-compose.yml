services:
  # MQTT broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: scheduler_mosquitto
    hostname: mosquitto
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - scheduler_network
    expose:
      - 1883
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 1s

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler/Dockerfile
    container_name: scheduler
    hostname: scheduler
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./config/scheduler/docker.json:/app/docker.json:ro
      - data:/data
    networks:
      - scheduler_network

networks:
  scheduler_network:

volumes:
  data:
